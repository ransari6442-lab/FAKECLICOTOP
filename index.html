        </div>

        </div>
      </div>

      <button id="checkBtn" onclick="verifyAndShowThemes()" class="w-full mt-2 py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-95 active:scale-[0.99] transition shadow-lg shadow-cyan-500/20">
