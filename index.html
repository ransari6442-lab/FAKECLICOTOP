    * { box-sizing: border-box; }
    html, body {

      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .btn-shine {
      position: relative;
      overflow: hidden;
      transition: transform 0.16s ease, box-shadow 0.2s ease;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: skewX(-25deg);
      animation: shineSweep 2.6s infinite;
    }
    .btn-shine:active { transform: scale(0.96); }
    @keyframes shineSweep {
      0% { left: -120%; }
      55%, 100% { left: 150%; }
    }
    .pulse-ring { animation: pulseGlow 2.4s infinite ease-in-out; }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .eq-bar { animation: eqBounce 1.1s infinite ease-in-out alternate; }
    @keyframes eqBounce {
      0% { transform: scaleY(0.35); }
      100% { transform: scaleY(1); }
    }
    .orb-float { animation: floatY 6s infinite ease-in-out alternate; }
    @keyframes floatY {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-18px) scale(1.06); }
    }
    .spin-slow { animation: spinSlow 9s linear infinite; }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
