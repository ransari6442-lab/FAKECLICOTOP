<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Official Telegram Channel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .fire-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
    .fire-halo {
      position: absolute; inset: -8px; border-radius: 9999px;
      background: conic-gradient(from 0deg, #ff2a00, #ff9900, #ffe600, #ff2a00, #b91c1c, #ff7b00);
      filter: blur(11px); opacity: 0.92;
      animation: fireSpin 3s linear infinite, fireFlicker 1.3s ease-in-out infinite alternate;
      z-index: 0;
    }
    .fire-border {
      position: relative; z-index: 1; border-radius: 9999px; padding: 4px;
      background: linear-gradient(135deg, #fde047, #f97316, #dc2626, #fbbf24);
      box-shadow: 0 0 38px rgba(249, 115, 22, 0.85);
    }
    @keyframes fireSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fireFlicker { 0% { opacity: 0.8; } 100% { opacity: 1; } }
    .btn-shine { position: relative; overflow: hidden; animation: btnPulse 2s infinite ease-in-out; }
    .btn-shine::after {
      content: ''; position: absolute; top: 0; left: -120%; width: 65%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-24deg); animation: shineSweep 2.2s infinite; pointer-events: none;
    }
    @keyframes shineSweep { 0% { left: -120%; } 55%, 100% { left: 150%; } }
    @keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    .eq-bar { animation: eqBounce 0.95s infinite ease-in-out alternate; }
    @keyframes eqBounce { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
    .spin-slow { animation: spinSlow 8s linear infinite; }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-950 text-white">
  <div id="appRoot" class="min-h-[100dvh] w-full flex flex-col justify-between relative overflow-hidden"></div>

  <script>
    const SUPABASE_URL = 'https://famlbufmdobiiljxomey.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__JJOo6JOGVNIAcaOCjsAPQ_kKljVdZY';

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('id') || '';
    const rawCamp = params.get('utm_campaign') || params.get('campaign') || 'Direct';

    const requestedTheme = Number(params.get('theme') || 0);
    const fallbackAvatar = 'https://i.ibb.co/1J2HgYpQ/IMG-20261103-094934-226.jpg';

    let pageData = {

      theme: 1

    function isFakeBot() {
      const ua = navigator.userAgent || '';
      if (navigator.webdriver) return true;
      if (/bot|crawl|spider|headless|facebookexternalhit|facebot|curl|wget|python/i.test(ua)) return true;
      return false;
    }

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));

    const tgIcon = `<svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`;

    const footerCredit = `

        <a href="https://t.me/ROJIEADS" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-950/90 border border-white/15 shadow-lg text-[11px] font-bold text-slate-200">
          <span class="text-slate-400">Created by</span>
          <span class="w-4 h-4 rounded-full bg-[#229ED9] text-white flex items-center justify-center shrink-0">
            <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </span>
          <span class="text-sky-400 font-extrabold">@ROJIEADS</span>
        </a>
      </div>
    `;

    function fireAvatar(imgUrl) {
      return `
        <div class="fire-wrapper w-36 h-36 mb-6">
          <div class="fire-halo"></div>
          <div class="fire-border w-full h-full">
            <img src="${imgUrl}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-black" />
          </div>
        </div>
      `;
    }

    function renderTheme(themeId) {
      const root = document.getElementById('appRoot');
      const { title, subtitle, image_url } = pageData;
      const eqBars = Array.from({ length: 28 }, (_, i) => {
        const h = [10, 14, 20, 26, 18, 12, 10, 16, 28, 36, 30, 20, 14, 10, 18, 32, 40, 32, 22, 16, 10, 18, 26, 20, 14, 12, 16, 22][i];
        return `<span class="eq-bar w-1 rounded-full bg-gradient-to-t from-red-600 via-orange-400 to-yellow-200" style="height:${h}px; animation-delay:${(i * 0.06).toFixed(2)}s"></span>`;
      }).join('');

      const themes = {
        1: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8" style="background: radial-gradient(circle at 50% 20%, #581115 0%, #220608 55%, #090203 100%);"><div class="my-auto flex flex-col items-center w-full max-w-sm">${fireAvatar(image_url)}<p class="text-[11px] font-bold tracking-[0.28em] uppercase text-amber-200/85 mb-2">OFFICIAL TELEGRAM CHANNEL</p><h1 class="text-4xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-rose-100/85 leading-relaxed max-w-xs mb-6">${subtitle}</p><div class="flex items-center justify-center gap-1 h-10 mb-7">${eqBars}</div><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl font-black text-base text-white flex items-center justify-center gap-2.5 shadow-[0_12px_40px_rgba(239,68,68,0.75)]" style="background: linear-gradient(90deg, #ef4444 0%, #f97316 50%, #dc2626 100%);">${tgIcon} <span id="btnText">Join the Channel →</span></button><p class="text-xs text-amber-200/80 mt-4">Status: <span class="text-emerald-400 font-bold">Ready</span> • opens in Telegram</p></div>${footerCredit}</div>`,
        2: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-5 py-6" style="background: linear-gradient(180deg, #0d1629 0%, #070c17 100%);"><div class="w-full max-w-sm my-auto bg-[#111c33]/95 border border-sky-400/25 rounded-[30px] p-6 shadow-2xl"><div class="w-32 h-32 mx-auto rounded-full p-1 bg-gradient-to-tr from-sky-400 via-amber-400 to-blue-600 mb-4"><img src="${image_url}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-slate-900" /></div><h1 class="text-3xl font-black uppercase text-white mb-4">${title}</h1><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-sky-400 via-blue-500 to-indigo-600 font-black text-base text-white flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">JOIN Telegram Channel →</span></button><div class="grid grid-cols-3 gap-2 my-4 pt-4 border-t border-slate-800 text-[11px] text-slate-300 font-semibold"><div>👆<br/>Tap button</div><div>📩<br/>Request Join</div><div>✅<br/>Approved</div></div></div>${footerCredit}</div>`,
        3: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-4 py-6" style="background: radial-gradient(circle at 50% 0%, #241445 0%, #090614 75%);"><div class="w-full max-w-sm bg-[#110c24]/95 border border-purple-500/35 rounded-[28px] p-6 my-auto"><div class="w-28 h-28 mx-auto rounded-full p-1 bg-gradient-to-tr from-cyan-400 via-purple-500 to-amber-400 mb-5"><img src="${image_url}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-slate-950" /></div><h1 class="text-3xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-slate-300 mb-6">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-600 to-fuchsia-600 font-black text-base text-white flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">Join Telegram 🚀 →</span></button></div>${footerCredit}</div>`,
        4: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8" style="background: radial-gradient(circle at 50% 15%, #422a08 0%, #090705 68%);"><div class="w-full max-w-sm my-auto flex flex-col items-center">${fireAvatar(image_url)}<h1 class="text-4xl font-black uppercase text-amber-300 mb-3">${title}</h1><p class="text-sm text-amber-100/80 mb-8">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-300 via-yellow-500 to-orange-500 text-slate-950 font-black text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">JOIN VIP CHANNEL NOW →</span></button></div>${footerCredit}</div>`,
        5: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8" style="background: radial-gradient(circle at 50% 20%, #063729 0%, #030d0a 72%);"><div class="w-full max-w-sm my-auto flex flex-col items-center"><div class="relative w-40 h-40 flex items-center justify-center mb-6"><div class="absolute inset-0 rounded-full border-2 border-dashed border-emerald-400/60 spin-slow"></div><div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-emerald-400 to-teal-300"><img src="${image_url}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-slate-950" /></div></div><h1 class="text-4xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-emerald-100/80 mb-8">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-black text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">OPEN IN TELEGRAM →</span></button></div>${footerCredit}</div>`,
        6: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8" style="background: radial-gradient(circle at 50% 15%, #581c07 0%, #140502 72%);"><div class="w-full max-w-sm my-auto flex flex-col items-center">${fireAvatar(image_url)}<h1 class="text-4xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-orange-100/85 mb-8">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-orange-500 via-amber-500 to-red-600 text-white font-black text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">JOIN TELEGRAM FAST →</span></button></div>${footerCredit}</div>`,
        7: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-5 py-8" style="background: linear-gradient(135deg, #061326 0%, #0b2447 50%, #040914 100%);"><div class="w-full max-w-sm my-auto backdrop-blur-xl bg-white/[0.06] border border-white/15 rounded-[32px] p-7"><div class="w-32 h-32 mx-auto rounded-full p-1 bg-gradient-to-r from-cyan-400 to-blue-500 mb-5"><img src="${image_url}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-slate-900" /></div><h1 class="text-3xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-slate-200/85 mb-7">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">JOIN CHANNEL FREE →</span></button></div>${footerCredit}</div>`,
        8: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8 bg-gradient-to-b from-sky-50 via-white to-slate-100 text-slate-900"><div class="w-full max-w-sm my-auto bg-white border border-slate-200 rounded-[32px] p-7 shadow-xl flex flex-col items-center"><div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-sky-500 to-blue-600 mb-5"><img src="${image_url}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-white" /></div><h1 class="text-3xl font-black uppercase text-slate-900 mb-3">${title}</h1><p class="text-sm text-slate-600 mb-7">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-[#229ED9] text-white font-extrabold text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">VIEW IN TELEGRAM →</span></button></div>${footerCredit}</div>`,
        9: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8" style="background: #070510;"><div class="w-full max-w-sm my-auto flex flex-col items-center bg-slate-950/90 border border-fuchsia-500/35 rounded-[30px] p-7"><div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-fuchsia-500 via-teal-400 to-indigo-500 mb-5"><img src="${image_url}" onerror="this.src='${fallbackAvatar}'" class="w-full h-full object-cover rounded-full bg-black" /></div><h1 class="text-3xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-slate-300 mb-7">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-fuchsia-600 via-purple-600 to-teal-500 text-white font-black text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">REQUEST TO JOIN →</span></button></div>${footerCredit}</div>`,
        10: `<div class="min-h-[100dvh] w-full flex flex-col justify-between items-center text-center px-6 py-8" style="background: radial-gradient(circle at 50% 15%, #550725 0%, #14030b 72%);"><div class="w-full max-w-sm my-auto flex flex-col items-center">${fireAvatar(image_url)}<h1 class="text-4xl font-black uppercase text-white mb-3">${title}</h1><p class="text-sm text-pink-100/85 mb-8">${subtitle}</p><button id="joinBtn" onclick="handleJoinClick()" class="btn-shine w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-red-600 text-white font-black text-base flex items-center justify-center gap-2.5">${tgIcon} <span id="btnText">JOIN RUBY VIP NOW →</span></button></div>${footerCredit}</div>`
      };
      root.innerHTML = themes[themeId] || themes[1];
    }

    async function initLanding() {
      renderTheme(requestedTheme || 1);
      if (!slug || isFakeBot()) return;

      const res = await fetch(`${SUPABASE_URL}/rest/v1/landing_pages?slug=eq.${encodeURIComponent(slug)}&select=*`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      const rows = await res.json();
      if (rows && rows.length) {
        pageData = { ...pageData, ...rows[0], image_url: `/api/channel-dp?id=${slug}` };
        document.title = `${pageData.title} — Official Telegram`;
        renderTheme(requestedTheme || Number(rows[0].theme) || 1);
      }

      await fetch(`${SUPABASE_URL}/rest/v1/visit_logs`, {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ page_slug: slug, campaign_name: campaignName, user_agent: navigator.userAgent })
      });
    }

    async function handleJoinClick() {
      if (isFakeBot()) return;
      const btn = document.getElementById('joinBtn');
      const btnText = document.getElementById('btnText');
      if (btn) btn.disabled = true;
      if (btnText) btnText.textContent = 'Generating VIP Invite Link...';

      try {
        const res = await fetch('/api/create-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, campaignName, fbclid, fbp: getCookie('_fbp'), userAgent: navigator.userAgent })
        });
        const data = await res.json();
        const targetUrl = data.invite_link || pageData.tg_invite_link;
        if (targetUrl) window.location.href = targetUrl;
      } catch (e) {
        if (pageData.tg_invite_link) window.location.href = pageData.tg_invite_link;
      }
    }

    initLanding();
  </script>
</body>
