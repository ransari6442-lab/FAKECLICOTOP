    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Rotating Fire / Plasma Ring Around DP */
    .fire-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fire-halo {
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, #ff2a00, #ff9900, #ffe600, #ff2a00, #b91c1c, #ff7b00);
      filter: blur(11px);
      opacity: 0.92;
      animation: fireSpin 3s linear infinite, fireFlicker 1.3s ease-in-out infinite alternate;
      z-index: 0;
    }
    .fire-border {
      position: relative;
      z-index: 1;
      border-radius: 9999px;
      padding: 4px;
      background: linear-gradient(135deg, #fde047, #f97316, #dc2626, #fbbf24);
      box-shadow: 0 0 38px rgba(249, 115, 22, 0.85), inset 0 0 12px rgba(255, 255, 255, 0.5);
    }
    @keyframes fireSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes fireFlicker {
      0% { opacity: 0.8; filter: blur(9px); }
      100% { opacity: 1; filter: blur(14px); }
    }

    /* Shimmer + Pulse CTA Button */
    .btn-shine {
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      animation: btnPulse 2s infinite ease-in-out;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0; left: -120%; width: 65%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-24deg);
      animation: shineSweep 2.2s infinite;
    }
    .btn-shine:active { transform: scale(0.95); }
    @keyframes shineSweep { 0% { left: -120%; } 55%, 100% { left: 150%; } }
    @keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }

    /* Equalizer Bars */
    .eq-bar { animation: eqBounce 0.95s infinite ease-in-out alternate; }
    @keyframes eqBounce { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }

    /* Floating Sparks */
    .spark {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      animation: sparkRise 4s infinite ease-in;
    }
    @keyframes sparkRise {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-140px) scale(0.3); opacity: 0; }
    }

    .spin-slow { animation: spinSlow 8s linear infinite; }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .cyber-grid {
      background-image: linear-gradient(rgba(217, 70, 239, 0.14) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(45, 212, 191, 0.14) 1px, transparent 1px);
      background-size: 26px 26px;
    }
  </style>
</head>
