<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Official Telegram Channel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
  <div id="cardContainer" class="w-full max-w-sm">
    <p class="text-center text-sm text-slate-400 animate-pulse">Loading Verified Channel...</p>
  </div>

  <script>
    const SUPABASE_URL = "https://famlbufmdobiiljxomey.supabase.co";
    const SUPABASE_KEY = "sb_publishable__JJOo6JOGVNIAcaOCjsAPQ_kKljVdZY";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const themes = [
      { bg: "bg-gradient-to-br from-zinc-900 via-neutral-900 to-amber-950 border-amber-500/40", btn: "bg-gradient-to-r from-amber-400 to-yellow-600 text-black", ring: "ring-amber-400" },
      { bg: "bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 border-cyan-400/40", btn: "bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950", ring: "ring-cyan-400" },
      { bg: "bg-gradient-to-br from-emerald-950 via-teal-950 to-slate-950 border-emerald-400/40", btn: "bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950", ring: "ring-emerald-400" },
      { bg: "bg-gradient-to-br from-rose-950 via-red-950 to-neutral-950 border-rose-500/40", btn: "bg-gradient-to-r from-rose-500 to-red-600 text-white", ring: "ring-rose-500" },
      { bg: "bg-gradient-to-br from-purple-950 via-fuchsia-950 to-slate-950 border-fuchsia-400/40", btn: "bg-gradient-to-r from-fuchsia-500 to-purple-600 text-white", ring: "ring-fuchsia-400" },
      { bg: "bg-gradient-to-br from-white via-slate-50 to-blue-50 border-slate-300 text-slate-900", btn: "bg-blue-600 text-white", ring: "ring-blue-600" },
      { bg: "bg-gradient-to-br from-orange-950 via-amber-950 to-stone-950 border-orange-400/40", btn: "bg-gradient-to-r from-orange-500 to-amber-500 text-white", ring: "ring-orange-400" },
      { bg: "bg-gradient-to-br from-sky-950 via-blue-950 to-slate-950 border-sky-400/40", btn: "bg-gradient-to-r from-sky-400 to-indigo-500 text-slate-950", ring: "ring-sky-400" }
    ];

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("id");
    const fbclid = params.get("fbclid") || "";
    let pageData = null;

    async function initPage() {
      if (!slug) return;
      const { data, error } = await db.from("landing_pages").select("*").eq("slug", slug).single();
      if (error || !data) {
        document.getElementById("cardContainer").innerHTML = `<p class="text-center text-rose-400">Invalid or Expired Link</p>`;
        return;
      }
      pageData = data;

      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', data.pixel_id);
      fbq('track', 'PageView');

      await db.from("landing_pages").update({ total_visits: (data.total_visits || 0) + 1 }).eq("slug", slug);

      const t = themes[data.theme_index] || themes[0];
      document.getElementById("cardContainer").innerHTML = `
        <div class="${t.bg} border rounded-3xl p-7 text-center shadow-2xl">
          <span class="inline-block px-3 py-1 text-[11px] font-semibold rounded-full bg-black/20 mb-4">✔ Certified 2026</span>
          <img src="${data.dp_url}" alt="DP" class="w-24 h-24 rounded-full mx-auto object-cover ring-4 ${t.ring} p-0.5 shadow-lg" />
          <h1 class="text-2xl font-extrabold mt-4">${data.channel_name}</h1>
          <p class="text-xs opacity-80 mt-2">Join Now Telegram • Get Latest Updates</p>
          <button onclick="handleJoinClick()" class="w-full mt-6 py-3.5 rounded-2xl font-extrabold text-sm shadow-lg active:scale-95 transition ${t.btn}">
            JOIN TELEGRAM CHANNEL →
          </button>
          <p class="text-[10px] opacity-60 mt-4">Best Offer • Verified Official Link</p>
        </div>
      `;
    }

    async function handleJoinClick() {
      if (!pageData || navigator.webdriver) return;

      const fbpMatch = document.cookie.match(/_fbp=([^;]+)/);
      const fbp = fbpMatch ? fbpMatch[1] : "";

      await db.from("click_logs").insert([{
        page_slug: slug,
        fbclid: fbclid,
        fbp: fbp,
        user_agent: navigator.userAgent
      }]);

      window.location.href = pageData.tg_invite_link;
    }

    initPage();
  </script>
</body>
</html>
